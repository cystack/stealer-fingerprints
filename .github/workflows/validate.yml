name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source and generated artifacts
        run: python tools/catalog.py validate
      - name: Verify deterministic generation
        run: python tools/catalog.py build --check
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Compile experimental YARA
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes yara
          yara -w rules/experimental_log_formats.yar /dev/null
